name: Tests

# Until now nothing verified a pull request — the only workflow here was the
# digest cron. PRs get merged from GitHub's mobile site and `main` deploys
# straight to Render, so a broken merge reached production with nothing in
# between. This is that missing step.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install extension test dependencies
        working-directory: chrome-extension/tests
        run: npm ci --no-audit --no-fund

      # One command, the same one used locally, so a green run here means
      # the same thing as a green run on the desktop.
      - name: Run all suites
        run: python run_tests.py

      # A development-only recording for this redesign PR. No production secrets.
      - name: Install motion preview tools
        if: github.event_name == 'pull_request' && github.head_ref == 'polish/responsive-workspace'
        run: |
          npm install --prefix "$RUNNER_TEMP/workspace-preview" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/workspace-preview/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify and record isolated animated workspace
        if: github.event_name == 'pull_request' && github.head_ref == 'polish/responsive-workspace'
        env:
          WORKSPACE_PLAYWRIGHT: ${{ runner.temp }}/workspace-preview/node_modules/playwright
        run: node scripts/record-workspace-preview.cjs

      - name: Upload downloadable motion preview
        if: github.event_name == 'pull_request' && github.head_ref == 'polish/responsive-workspace'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-motion-preview
          path: workspace-preview/
          retention-days: 7
          if-no-files-found: error
