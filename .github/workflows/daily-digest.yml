name: Daily Job Digest

on:
  schedule:
    # 4:00 AM Eastern (EDT) = 08:00 UTC. GitHub cron is fixed UTC and does
    # NOT adjust for DST: once EST starts in November this fires at 3:00 AM
    # Eastern — change to "0 9 * * *" then if 4 AM should hold year-round.
    - cron: "0 8 * * *"
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint on Render
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            https://job-search-app-9pnx.onrender.com/api/digest)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "Digest endpoint returned HTTP $status — failing"
            exit 1
          fi
