name: Daily Job Digest

on:
  # Runs at 08:00 UTC: 4:00 AM during U.S. Eastern daylight time.
  # Each run calls Apify and costs about $0.60 (~$18/month).
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:   # still allows a manual one-off run from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint on Render
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            https://job-search-app-9pnx.onrender.com/api/digest)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "Digest endpoint returned HTTP $status — failing"
            exit 1
          fi
