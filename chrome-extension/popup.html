<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Auto-fill</h1>
    <p class="subtitle">from Job Search App</p>
  </div>

  <!-- Status area -->
  <div id="status" class="status status-info">Checking session…</div>

  <!-- Server selector (lets you point at local dev) -->
  <details class="server-select">
    <summary>API server</summary>
    <label>
      <input type="radio" name="server" value="https://job-search-app-9pnx.onrender.com" checked>
      Production (Render)
    </label>
    <label>
      <input type="radio" name="server" value="http://localhost:5000">
      Local (localhost:5000)
    </label>
  </details>

  <!-- Main button -->
  <button id="fillBtn" class="btn-primary" disabled>
    Auto-fill this form
  </button>

  <!-- Login helper -->
  <a id="loginLink" class="btn-link" target="_blank" style="display:none;">
    Log in to Job Search App →
  </a>

  <!-- Results readout -->
  <div id="results" class="results"></div>

  <p class="footer">
    Always review fields before clicking Submit. This extension never submits forms for you.
  </p>

  <script src="popup.js"></script>
</body>
</html>
